name: YadroKreator — UI & SQLite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install web dependencies
        run: python -m pip install -r requirements.txt
      - name: SQLite and Flask API tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Python syntax
        run: python -m compileall -q app.py core.py worker.py git_sources.py tests
      - name: Installer shell syntax
        run: bash -n install.sh bootstrap.sh deploy.sh setup-update-timer.sh
