name: YadroKreator — UI & SQLite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install web dependencies
        run: python -m pip install -r requirements.txt
      - name: SQLite and Flask API tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Python syntax
        run: python -m compileall -q app.py core.py worker.py git_sources.py update_manager.py artifact_checks.py build_metrics.py download_access.py export_policy.py helper_profiles.py project_profiles.py irila_sources.py irila_preflight.py scripts/cleanup_legacy_builds.py scripts/sync_core_projects.py scripts/prune_merged_branches.py tests
      - name: Browser JavaScript syntax
        run: node --check static/app.js
      - name: Validate SVG graphics
        run: python -c "import xml.etree.ElementTree as E; from pathlib import Path; [E.parse(x) for x in list(Path('docs/previews').glob('*.svg'))+list(Path('docs/screenshots').glob('*.svg'))]"
      - name: Recovery helper shell syntax
        run: bash -n scripts/recover_dashboard_update.sh
      - name: Installer shell syntax
        run: bash -n install.sh bootstrap.sh deploy.sh setup-update-timer.sh start.sh stop.sh scripts/project-control.sh scripts/cleanup_old_results.sh scripts/sync_core_projects.sh scripts/prune_merged_branches.sh scripts/update_factory.sh scripts/update_wificam.sh scripts/update_irila.sh scripts/update_wifcam_helper.sh
