<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" role="img" aria-label="Different types of disk images and safe installation workflow">
<rect width="1280" height="610" rx="24" fill="#0d1523"/>
<text x="50" y="55" font-size="30" fill="#eaf2ff" font-family="sans-serif" font-weight="bold">Как записывать разные образы · Device / Image routes</text>
<text x="50" y="86" font-size="16" fill="#a3b5cf" font-family="sans-serif">Выбираем по типу файла и модели оборудования, не по расширению в одиночку</text>
<rect x="40" y="124" width="590" height="380" rx="18" fill="#162438" stroke="#5cd4bd" stroke-width="2"/>
<text x="66" y="172" fill="#5cd4bd" font-size="22" font-family="sans-serif" font-weight="bold">A · FULL DISK IMAGE</text>
<text x="66" y="207" fill="#eaf2ff" font-size="17" font-family="monospace">thingino-t23-sd.bin / board.img</text>
<rect x="65" y="250" width="540" height="80" rx="14" fill="#253c50" stroke="#7298a6"/>
<text x="85" y="283" fill="#e6f1ff" font-size="20" font-family="sans-serif">Кардридер → SD / USB / совместимый SSD</text>
<text x="85" y="312" fill="#b3c9e2" font-size="16" font-family="sans-serif">Raw-запись с LBA0 · проверка readback</text>
<path d="M334 214V243m-8 -10 8 10 8 -10" fill="none" stroke="#60d7c2" stroke-width="3"/>
<text x="66" y="374" fill="#b8d3e2" font-size="16" font-family="sans-serif">Без предварительного форматирования</text>
<text x="66" y="404" fill="#b8d3e2" font-size="16" font-family="sans-serif">Смещения загрузчика уже в образе</text>
<text x="66" y="450" fill="#ffcd8b" font-size="16" font-family="sans-serif">Только для совместимой платы и носителя!</text>
<rect x="650" y="124" width="590" height="380" rx="18" fill="#172238" stroke="#83aaff" stroke-width="2"/>
<text x="676" y="172" fill="#9cbdff" font-size="22" font-family="sans-serif" font-weight="bold">B · INSTALLER ISO</text>
<text x="676" y="207" fill="#eaf2ff" font-size="17" font-family="monospace">Windows.iso / Ubuntu.iso</text>
<rect x="675" y="245" width="235" height="108" rx="12" fill="#2c4261"/>
<text x="792" y="281" text-anchor="middle" fill="#eaf2ff" font-size="17" font-family="sans-serif">Создать USB</text>
<text x="792" y="310" text-anchor="middle" fill="#c7d7f0" font-size="15" font-family="sans-serif">Rufus / Etcher*</text>
<path d="M913 297H966m-10 -8 10 8 -10 8" fill="none" stroke="#8eaffe" stroke-width="3"/>
<rect x="969" y="245" width="243" height="108" rx="12" fill="#2c4261"/>
<text x="1090" y="281" text-anchor="middle" fill="#eaf2ff" font-size="17" font-family="sans-serif">Загрузить ПК</text>
<text x="1090" y="311" text-anchor="middle" fill="#c7d7f0" font-size="15" font-family="sans-serif">Установка на SSD</text>
<text x="676" y="404" fill="#b8d3e2" font-size="16" font-family="sans-serif">Выбор целевого SSD внутри установщика</text>
<text x="676" y="450" fill="#ffcd8b" font-size="16" font-family="sans-serif">Нельзя просто записать ISO на системный NVMe!</text>
<rect x="42" y="530" width="1198" height="49" rx="12" fill="#2a2735"/>
<text x="64" y="561" fill="#f9d6a6" font-size="17" font-family="sans-serif">В обоих сценариях неверно выбранный диск = полная потеря данных.  *Для Windows ISO используйте Rufus.</text>
</svg>